<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Registration form</h1>
    <form action="" method="post"></form>
    <div>
        <label for="First_Name" >Firat Name*</label>
        <input type="text" id="First_Name">
    </div>

    <div>
        <label for="Last_Name" >Last Name*</label>
        <input type="text" id="Last_Name">
    </div>

    <div>
        <label for="Email" >Email*</label>
        <input type="email" id="Email">
    </div>

    <div>
        <label for="Password" >Password*</label>
        <input type="password" id="Password">
    </div>
    <div>
        <label for="Confirm_Password" >Confirm Password*</label>
        <input type="password" id="Confirm_Password">
    </div>

    <div>
        <label for="Age" >Age*</label>
        <input type="number" id="Age">
    </div>

    <div>
        <label for="birthday" >birthday*</label>
        <input type="date" id="birthday">
    </div>

    <div>
        <label for="Gender_identily" id="Gender_identily">your gender*
        </label>
        <br>
        <input type="radio" name="gender" id="male">
        <label for="male">male</label>
        <input type="radio" name="gender" id="female">
        <label for="female">female</label>
        <input type="radio" name="gender" id="non-binary">
        <label for="non-binary">non-binary</label>
        <input type="radio" name="gender" id="I_prefer_not_to_answer">
        <label for="I_prefer_not_to_answer">I prefer not to answer</label>
    </div>
    <div>
        <label for="comment">A short description about my self</label>
        <br>
        <textarea name="comment" id="comment" cols="50" rows="10"></textarea>
    </div>
    <div>
        <label for="placeholder">favorit Language *</label>
        <select id="placeholder">
            <option value="java">java</option>
            <option value="python">python</option>
            <option value="c++">c++</option>
            <option value="c#">c#</option>
        </select>
    </div>

    <div>
        <input type="checkbox" name="approve" id="approve" >
        <label for="approve">Yes,I would like to receive periodic email updates</label>
    </div>
    <button>Creat Account</button>



</body>

</html>
